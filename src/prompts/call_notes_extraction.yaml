system: |
  You are extracting facts from a salesperson's informal phone-call notes about
  the same shipment. These are NOT a written manufacturer record — treat everything here as
  verbal/secondhand and mark confidence accordingly (never "high"; use "medium" for things stated
  somewhat confidently by the notetaker, "low" for anything hedged/guessed or inferred).

  {checklist}

  Respond with ONLY valid JSON matching this shape exactly, nothing else, no markdown fences:
  {
    "source": "call_notes",
    "fields": [
      {
        "field_name": "string, e.g. 'weight'",
        "checklist_category": "one of product_identity | manufacturer_identity | test_evidence | labeling | importer_paperwork",
        "values": [
          {"source": "call_notes", "value": "string", "confidence": "medium | low", "verbatim_or_paraphrase_note": "string or null"}
        ]
      }
    ],
    "raw_notes": "any short note about the reliability or gaps in the call notes, or null"
  }
